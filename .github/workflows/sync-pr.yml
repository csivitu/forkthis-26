name: Sync PRs and Issues

on:
  schedule:
    # Runs every 15 minutes. GitHub Actions cron uses UTC and can be delayed
    # by a few minutes under load - fine for this use case, not something to
    # rely on for exact timing.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you manually trigger a run from the Actions tab, useful for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # matches devEngines.packageManager in your root package.json

      - name: Install dependencies
        run: bun install

      - name: Run PR/issue sync
        working-directory: apps/api
        run: bun run sync:prs
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}