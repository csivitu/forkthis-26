services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        env_file:
            - .env
        environment:
            NODE_ENV: production
        healthcheck:
            test: ["CMD", "bun", "run", "src/scripts/healtcheck.ts"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        restart: unless-stopped